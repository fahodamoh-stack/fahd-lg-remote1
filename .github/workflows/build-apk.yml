name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lg_remote/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lg_remote
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: lumina-release-apk
          path: lg_remote/build/app/outputs/flutter-apk/app-release.apk
