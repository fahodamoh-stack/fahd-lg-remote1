name: flutter
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native folders
        run: |
          flutter create --project-name fahd_lg_remote --org com.example.fahd /tmp/shellapp --platforms=android,ios
          cp -r /tmp/shellapp/android ./android
          cp -r /tmp/shellapp/ios ./ios
          python3 tools/ci_inject_perms.py
      - run: flutter pub get
      - name: Format code
        run: dart format lib test
      - name: Commit formatting fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format Dart code"
          file_pattern: "lib/** test/**"
      - name: Analyze
        run: flutter analyze lib test
      - name: Run unit tests (pure protocol, no device needed)
        run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fahd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
