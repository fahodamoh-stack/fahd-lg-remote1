name: flutter
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate native folders
        run: |
          flutter create --project-name fahd_lg_remote --org com.example.fahd /tmp/shellapp --platforms=android,ios
          cp -r /tmp/shellapp/android ./android
          cp -r /tmp/shellapp/ios ./ios
          python3 tools/ci_inject_perms.py
      - run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test tools/ci_inject_perms.py tools/verify.py tools/make_sounds.py
      - name: Analyze
        run: flutter analyze lib test
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fahd-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
